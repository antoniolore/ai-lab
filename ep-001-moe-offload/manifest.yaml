software:
  llama_cpp:
    release: b12034
    commit: 1c5ed702c9e540ac14cc8c78100ea3984bc0e227  # short form 1c5ed702c verified in every llama-bench JSON
    source: https://github.com/ggml-org/llama.cpp/releases/tag/b12034
    builds:
      macos:
        file: llama-b12034-bin-macos-arm64.tar.gz
        sha256: "ce1893ad…1d9b (abbreviated in the lab notes; checked against the GitHub release digest)"
        backends: "MTL,BLAS"                        # verified: JSON backends
      linux_cuda:
        file: llama-b12034-bin-ubuntu-cuda-12.8-x64.tar.gz
        sha256: aadc322fdf95b50e5c5442fee71b8f757ea31f88ef53cf3dddea877da59d2052
      linux_cudart:
        file: cudart-llama-b12034-bin-ubuntu-cuda-12.8-x64.tar.gz
        sha256: 4cdd72a0052d6796e070c80c23537477ed5b2d1554273945df63533e4c004468
      cpu_backend_selected: haswell                 # verified: desktop stderr (libggml-cpu-haswell.so)
  container_runtime_image:
    image: "ghcr.io/ggml-org/llama.cpp@sha256:3e7673cce183a55f97a1bc3c80817f3c61452483c13bc088a6766388af4775fe"
    note: "used only as Ubuntu 24.04 userland; its own llama.cpp is not used (entrypoint overridden)"
  vram_ballast_image:
    image: "vllm/vllm-openai:v0.30.0"
    note: "used only for torch.cuda allocation; any PyTorch CUDA image works"

