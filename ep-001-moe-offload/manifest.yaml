claim:
  source: "Abhinav Raj, XDA Developers, 2026-10-22"
  headline: "I changed one llama.cpp flag, and my 8GB laptop GPU now runs a 35B model faster than I can read"
  url: "https://www.xda-developers.com/i-stopped-thinking-my-8gb-gpu-was-too-small-after-learning-to-offload-moe-llm-layers-to-ram/"
  read_at_source: 2026-11-02
  declared_hardware: "Lenovo Legion 5, RTX 3070 Mobile 8 GB, Windows 11; CPU, RAM and llama.cpp build not stated"
  declared_command: "llama-bench -m Qwen3.6-27B-IQ4_XS.gguf -m Qwen3.6-35B-A3B-UD-IQ4_XS.gguf -ngl 99 -ncmoe 0,28 -p 512 -n 128 -r 3 -ctk q8_0 -ctv q8_0"
  declared_results_t_per_s:   # declared by the article (table), not measured here
    - {model: qwen3.6-27b-iq4_xs, ncmoe: null, pp512: 38.83, tg128: 0.75}
    - {model: qwen3.6-35b-a3b-ud-iq4_xs, ncmoe: 0, pp512: 109.66, tg128: 4.02}
    - {model: qwen3.6-35b-a3b-ud-iq4_xs, ncmoe: 28, pp512: 341.37, tg128: 32.82}

